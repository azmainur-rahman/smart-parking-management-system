<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Smart Parking System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/components.css">
  <style>
    .admin-placeholder {
      padding: var(--space-12) 0;
      min-height: 60vh;
      display: flex;
      align-items: center;
    }
    .placeholder-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: var(--space-8);
      max-width: 640px;
      margin: 0 auto;
    }
    .placeholder-title {
      font-family: var(--font-heading);
      font-size: var(--text-2xl);
      font-weight: 600;
      color: var(--color-ink);
      margin-bottom: var(--space-3);
    }
    .placeholder-desc {
      color: var(--color-ink-muted);
      font-size: var(--text-sm);
      line-height: 1.6;
      margin-bottom: var(--space-6);
    }
    .placeholder-actions {
      display: flex;
      gap: var(--space-4);
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main id="main-content" class="admin-placeholder" tabindex="-1">
    <div class="container">
      <div class="placeholder-card">
        <span class="status-badge" style="border: 1px solid var(--color-border); padding: 4px 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; margin-bottom: 16px; display: inline-block;">System Administration</span>
        <h1 class="placeholder-title">Administrator Portal</h1>
        <p class="placeholder-desc">The centralized administration console is currently being configured. You may access facility operations and live parking oversight via the Manager Console.</p>
        <div class="placeholder-actions">
          <a href="../manager/dashboard.html" class="btn btn-primary" style="display:inline-block; padding: 10px 18px; background: var(--color-accent); color: #fff; text-decoration: none; font-size: 13px; font-weight: 600;">Go to Manager Console</a>
          <a href="../../index.html" class="btn btn-secondary" style="display:inline-block; padding: 10px 18px; border: 1px solid var(--color-border); color: var(--color-ink); text-decoration: none; font-size: 13px; font-weight: 500;">Return to Home</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/navbar.js"></script>
  <script src="../../js/site-chrome.js"></script>
</body>
</html>
