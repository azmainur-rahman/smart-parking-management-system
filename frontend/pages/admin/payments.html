<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Transactions Ledger — Smart Parking Admin</title>
  <meta name="description" content="Centralized payments and settlement transactions audit.">
  <meta name="theme-color" content="#A8532E">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../../images/smart-parking-icon.svg">
  <link rel="alternate icon" type="image/png" href="../../images/favicon.png">

  <!-- Google Fonts: Fraunces & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/manager.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <!-- Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/admin-shell.js"></script>

  <script>
    async function initAdminPayments() {
      try {
        const appContent = renderAdminShell('payments');
        if (!appContent) return;

        // 1. Header
        const header = document.createElement('header');
        header.className = 'app-page-header';

        const titleWrap = document.createElement('div');
        const eyebrow = document.createElement('p');
        eyebrow.className = 'app-page-eyebrow';
        eyebrow.textContent = 'Revenue & Settlement';

        const title = document.createElement('h1');
        title.className = 'app-page-title';
        title.textContent = 'Financial Transactions Ledger';

        const desc = document.createElement('p');
        desc.className = 'app-page-desc';
        desc.textContent = 'Audit gateway transaction IDs, settlement timestamps, collected amounts, and refund records.';

        titleWrap.appendChild(eyebrow);
        titleWrap.appendChild(title);
        titleWrap.appendChild(desc);
        header.appendChild(titleWrap);
        appContent.appendChild(header);

        // Mount Container
        const container = document.createElement('div');
        container.id = 'admin-payments-container';
        appContent.appendChild(container);

        // Metric Summary Strip
        const summaryGrid = document.createElement('section');
        summaryGrid.className = 'stat-grid';
        summaryGrid.style.marginBottom = 'var(--space-5)';
        summaryGrid.id = 'payments-summary-grid';
        container.appendChild(summaryGrid);

        // Filter Bar
        const topBar = document.createElement('div');
        topBar.style.display = 'flex';
        topBar.style.flexWrap = 'wrap';
        topBar.style.gap = 'var(--space-3)';
        topBar.style.marginBottom = 'var(--space-4)';
        topBar.style.alignItems = 'center';

        const searchInput = document.createElement('input');
        searchInput.type = 'text';
        searchInput.placeholder = 'Search transaction ID...';
        searchInput.className = 'form-input';
        searchInput.style.width = '260px';

        const statusSelect = document.createElement('select');
        statusSelect.className = 'form-select';
        statusSelect.innerHTML = `
          <option value="">All Transactions</option>
          <option value="SUCCESS">SUCCESS (Settled)</option>
          <option value="PENDING">PENDING</option>
          <option value="FAILED">FAILED</option>
          <option value="CANCELLED">CANCELLED</option>
        `;

        const filterBtn = document.createElement('button');
        filterBtn.type = 'button';
        filterBtn.className = 'btn btn-secondary';
        filterBtn.textContent = 'Filter';
        filterBtn.addEventListener('click', () => fetchPayments(1));

        topBar.appendChild(searchInput);
        topBar.appendChild(statusSelect);
        topBar.appendChild(filterBtn);
        container.appendChild(topBar);

        const tableContainer = document.createElement('div');
        container.appendChild(tableContainer);

        async function fetchPayments(page = 1) {
          tableContainer.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--color-ink-muted);">Loading financial transactions...</div>';

          const query = searchInput.value.trim();
          const status = statusSelect.value;

          let url = `/admin/payments?page=${page}&limit=20`;
          if (query) url += `&q=${encodeURIComponent(query)}`;
          if (status) url += `&status=${encodeURIComponent(status)}`;

          try {
            const res = await apiRequest(url);
            renderSummary(res.summary || {});
            renderPaymentsTable(res.payments || [], res.pagination || {});
          } catch (err) {
            tableContainer.innerHTML = `<div class="error-notice">Failed to load transactions: ${err.message}</div>`;
          }
        }

        function renderSummary(summary) {
          summaryGrid.innerHTML = '';
          summaryGrid.appendChild(createStatCard('Total Collected', `৳${summary.totalCollected || 0}`, `${summary.countSuccess || 0} settled transactions`));
          summaryGrid.appendChild(createStatCard('Pending Payment', `৳${summary.totalPending || 0}`, 'Awaiting gateway checkout'));
          summaryGrid.appendChild(createStatCard('Failed / Cancelled', `৳${summary.totalFailed || 0}`, 'Unsuccessful attempts'));
        }

        function renderPaymentsTable(payments, pagination) {
          if (payments.length === 0) {
            tableContainer.innerHTML = '<div style="padding: 40px; background: #fff; border: 1px solid var(--color-border); text-align: center; color: var(--color-ink-muted);">No transaction logs recorded yet.</div>';
            return;
          }

          const wrap = document.createElement('div');
          wrap.style.overflowX = 'auto';
          wrap.style.background = '#FFFFFF';
          wrap.style.border = '1px solid var(--color-border)';

          const table = document.createElement('table');
          table.style.width = '100%';
          table.style.borderCollapse = 'collapse';
          table.style.fontSize = 'var(--text-xs)';

          table.innerHTML = `
            <thead>
              <tr style="border-bottom: 1px solid var(--color-border); text-align: left; background: var(--color-surface);">
                <th style="padding: 10px 14px;">Transaction ID</th>
                <th style="padding: 10px 14px;">Booking #</th>
                <th style="padding: 10px 14px;">Customer</th>
                <th style="padding: 10px 14px;">Amount</th>
                <th style="padding: 10px 14px;">Gateway</th>
                <th style="padding: 10px 14px;">Status</th>
                <th style="padding: 10px 14px;">Date</th>
              </tr>
            </thead>
            <tbody>
              ${payments.map(p => `
                <tr style="border-bottom: 1px solid var(--color-border);">
                  <td style="padding: 10px 14px; font-weight: 600; font-family: monospace;">${p.transactionId}</td>
                  <td style="padding: 10px 14px;">${p.bookingId ? p.bookingId.bookingNumber : '-'}</td>
                  <td style="padding: 10px 14px;">
                    <div>${p.userId ? p.userId.name : 'Unknown'}</div>
                    <div style="color: var(--color-ink-muted); font-size:11px;">${p.userId ? p.userId.email : ''}</div>
                  </td>
                  <td style="padding: 10px 14px; font-weight: 600;">৳${p.amount} ${p.currency}</td>
                  <td style="padding: 10px 14px;"><span class="badge" style="background:#eee; font-size:10px;">${p.gateway}</span></td>
                  <td style="padding: 10px 14px;">
                    <span class="badge ${p.status === 'SUCCESS' ? 'badge-success' : (p.status === 'PENDING' ? 'badge-warning' : 'badge-error')}">${p.status}</span>
                  </td>
                  <td style="padding: 10px 14px; color: var(--color-ink-muted); font-size:11px;">${new Date(p.createdAt).toLocaleString()}</td>
                </tr>
              `).join('')}
            </tbody>
          `;

          wrap.appendChild(table);
          tableContainer.innerHTML = '';
          tableContainer.appendChild(wrap);

          // Pagination
          if (pagination.totalPages > 1) {
            const pageDiv = document.createElement('div');
            pageDiv.style.display = 'flex';
            pageDiv.style.justifyContent = 'space-between';
            pageDiv.style.alignItems = 'center';
            pageDiv.style.marginTop = 'var(--space-4)';

            const pageInfo = document.createElement('span');
            pageInfo.style.fontSize = 'var(--text-xs)';
            pageInfo.style.color = 'var(--color-ink-muted)';
            pageInfo.textContent = `Page ${pagination.page} of ${pagination.totalPages} (${pagination.total} records)`;

            const btnWrap = document.createElement('div');
            btnWrap.style.display = 'flex';
            btnWrap.style.gap = 'var(--space-2)';

            if (pagination.page > 1) {
              const prev = document.createElement('button');
              prev.className = 'btn btn-secondary';
              prev.style.padding = '4px 10px';
              prev.textContent = '← Prev';
              prev.onclick = () => fetchPayments(pagination.page - 1);
              btnWrap.appendChild(prev);
            }

            if (pagination.page < pagination.totalPages) {
              const next = document.createElement('button');
              next.className = 'btn btn-secondary';
              next.style.padding = '4px 10px';
              next.textContent = 'Next →';
              next.onclick = () => fetchPayments(pagination.page + 1);
              btnWrap.appendChild(next);
            }

            pageDiv.appendChild(pageInfo);
            pageDiv.appendChild(btnWrap);
            tableContainer.appendChild(pageDiv);
          }
        }

        function createStatCard(label, value, subtext = '') {
          const card = document.createElement('div');
          card.className = 'stat-card';

          const lbl = document.createElement('span');
          lbl.className = 'stat-card-label';
          lbl.textContent = label;

          const val = document.createElement('div');
          val.className = 'stat-card-value';
          val.textContent = value;

          card.appendChild(lbl);
          card.appendChild(val);

          if (subtext) {
            const sub = document.createElement('span');
            sub.className = 'stat-card-sub';
            sub.textContent = subtext;
            card.appendChild(sub);
          }

          return card;
        }

        // Initial Load
        fetchPayments(1);

      } catch (err) {
        console.error('Admin Payments Init Error:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', initAdminPayments);
  </script>
</body>
</html>
