<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard — Smart Parking</title>
  <meta name="description" content="Manage your active parking reservations, registered vehicles, and parking passes.">
  <meta name="theme-color" content="#A8532E">

  <!-- Google Fonts: Fraunces (Serif) & Inter (Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <!-- Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/shell.js"></script>

  <script>
    async function initDashboard() {
      try {
        const appContent = renderShell('dashboard');
        if (!appContent) return;

        const user = getUser();
        const firstName = user && user.name ? user.name.trim().split(' ')[0] : 'Customer';
        const siteRoot = window.SITE_ROOT || '../../';

        // Page Header
        const header = document.createElement('header');
        header.className = 'app-page-header';

        const titleWrap = document.createElement('div');
        const eyebrow = document.createElement('p');
        eyebrow.className = 'app-page-eyebrow';
        eyebrow.textContent = 'Account Overview';

        const title = document.createElement('h1');
        title.className = 'app-page-title';
        title.textContent = `Welcome, ${firstName}`;

        const desc = document.createElement('p');
        desc.className = 'app-page-desc';
        desc.textContent = 'Monitor your upcoming bookings, vehicle records, and digital passes.';

        titleWrap.appendChild(eyebrow);
        titleWrap.appendChild(title);
        titleWrap.appendChild(desc);
        header.appendChild(titleWrap);

        const findParkingBtn = document.createElement('a');
        findParkingBtn.className = 'btn-primary';
        findParkingBtn.href = `${siteRoot}index.html#parking-locations`;
        findParkingBtn.textContent = 'Find Parking';
        header.appendChild(findParkingBtn);

        appContent.appendChild(header);

        // Section 1: Stat Blocks
        const statContainer = document.createElement('div');
        statContainer.className = 'stat-grid';
        statContainer.appendChild(loadingSkeleton(3, 'card'));
        appContent.appendChild(statContainer);

        // Section 2: Upcoming Bookings
        const bookingsSection = document.createElement('section');
        bookingsSection.className = 'content-section';
        bookingsSection.setAttribute('aria-labelledby', 'upcoming-bookings-title');

        const sectionTitle = document.createElement('h2');
        sectionTitle.className = 'section-title';
        sectionTitle.id = 'upcoming-bookings-title';
        sectionTitle.textContent = 'Upcoming Bookings';
        bookingsSection.appendChild(sectionTitle);

        const listContainer = document.createElement('div');
        listContainer.id = 'upcoming-bookings-list';
        listContainer.appendChild(loadingSkeleton(3, 'card'));
        bookingsSection.appendChild(listContainer);

        appContent.appendChild(bookingsSection);

        // Load Data
        async function loadDashboardData() {
          try {
            // 1. Fetch Summary Stats
            const summaryRes = await apiRequest('/dashboard/summary');
            const summary = summaryRes.summary || { upcoming: 0, completed: 0, vehicles: 0 };

            statContainer.innerHTML = '';
            const stats = [
              { label: 'Upcoming Reservations', value: summary.upcoming || 0 },
              { label: 'Completed Sessions', value: summary.completed || 0 },
              { label: 'Registered Vehicles', value: summary.vehicles || 0 }
            ];

            stats.forEach((item) => {
              const card = document.createElement('div');
              card.className = 'stat-card';

              const l = document.createElement('div');
              l.className = 'stat-label';
              l.textContent = item.label;

              const v = document.createElement('div');
              v.className = 'stat-value';
              v.textContent = String(item.value);

              card.appendChild(l);
              card.appendChild(v);
              statContainer.appendChild(card);
            });

            // 2. Fetch User Bookings
            const bookingsRes = await apiRequest('/bookings');
            const allBookings = bookingsRes.bookings || [];
            const now = new Date();

            // Client-side filter: CONFIRMED or ACTIVE with future endTime
            const upcomingBookings = allBookings
              .filter((b) => ['CONFIRMED', 'ACTIVE'].includes(b.bookingStatus) && new Date(b.endTime) >= now)
              .sort((a, b) => new Date(a.startTime) - new Date(b.startTime))
              .slice(0, 5);

            listContainer.innerHTML = '';

            if (upcomingBookings.length === 0) {
              const empty = emptyState(
                'No Upcoming Reservations',
                'You have no scheduled parking sessions at this time. Book ahead to guarantee your parking bay.',
                'Search Parking Spaces',
                `${siteRoot}index.html#parking-locations`
              );
              listContainer.appendChild(empty);
            } else {
              upcomingBookings.forEach((b) => {
                const row = document.createElement('article');
                row.className = 'booking-row';

                const mainInfo = document.createElement('div');
                mainInfo.className = 'booking-main-info';

                const bNum = document.createElement('span');
                bNum.className = 'booking-number';
                bNum.textContent = b.bookingNumber;

                const locText = document.createElement('span');
                locText.className = 'booking-location';
                const locName = b.locationId && b.locationId.name ? b.locationId.name : 'Parking Facility';
                const slotName = b.slotId && b.slotId.slotNumber ? ` • Slot ${b.slotId.slotNumber}` : '';
                locText.textContent = `${locName}${slotName}`;

                mainInfo.appendChild(bNum);
                mainInfo.appendChild(locText);

                const metaInfo = document.createElement('div');
                metaInfo.className = 'booking-meta';

                const timeSpan = document.createElement('span');
                timeSpan.className = 'booking-time';
                timeSpan.textContent = `${formatDate(b.startTime)}, ${formatTime(b.startTime)} – ${formatTime(b.endTime)}`;

                const badge = statusBadge(b.bookingStatus);

                metaInfo.appendChild(timeSpan);
                metaInfo.appendChild(badge);

                if (b.paymentStatus === 'PAID') {
                  const slipLink = document.createElement('a');
                  slipLink.href = `../booking-slip.html?id=${b._id}`;
                  slipLink.className = 'btn-row-action';
                  slipLink.style.padding = '2px 10px';
                  slipLink.style.minHeight = '36px';
                  slipLink.textContent = 'View Slip';
                  metaInfo.appendChild(slipLink);
                }

                row.appendChild(mainInfo);
                row.appendChild(metaInfo);

                listContainer.appendChild(row);
              });
            }
          } catch (err) {
            console.error('Failed to load dashboard data:', err);
            statContainer.innerHTML = '';
            listContainer.innerHTML = '';

            const errorWrap = document.createElement('div');
            errorWrap.className = 'empty-state';

            const errTitle = document.createElement('h3');
            errTitle.className = 'empty-state-title';
            errTitle.textContent = 'Unable to Load Dashboard Data';

            const errMsg = document.createElement('p');
            errMsg.className = 'empty-state-text';
            errMsg.textContent = err.message || 'An error occurred while communicating with the parking service.';

            const retryBtn = document.createElement('button');
            retryBtn.type = 'button';
            retryBtn.className = 'btn-primary';
            retryBtn.textContent = 'Retry';
            retryBtn.addEventListener('click', () => {
              statContainer.innerHTML = '';
              statContainer.appendChild(loadingSkeleton(3, 'card'));
              listContainer.innerHTML = '';
              listContainer.appendChild(loadingSkeleton(3, 'card'));
              loadDashboardData();
            });

            errorWrap.appendChild(errTitle);
            errorWrap.appendChild(errMsg);
            errorWrap.appendChild(retryBtn);

            listContainer.appendChild(errorWrap);
          }
        }

        await loadDashboardData();
      } catch (err) {
        console.error('Dashboard initialization error:', err);
        const mount = document.getElementById('app-content') || document.body;
        mount.innerHTML = '';

        const errorWrap = document.createElement('div');
        errorWrap.className = 'container';
        errorWrap.style.padding = 'var(--space-8) var(--space-4)';

        const card = document.createElement('div');
        card.className = 'empty-state';
        card.style.maxWidth = '600px';
        card.style.margin = '0 auto';

        const errTitle = document.createElement('h2');
        errTitle.className = 'empty-state-title';
        errTitle.textContent = 'Unable to Load Dashboard';

        const errMsg = document.createElement('p');
        errMsg.className = 'empty-state-text';
        errMsg.textContent = err.message || 'An unexpected error occurred while initializing the dashboard.';

        const retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'btn-primary';
        retryBtn.textContent = 'Retry';
        retryBtn.addEventListener('click', () => {
          window.location.reload();
        });

        card.appendChild(errTitle);
        card.appendChild(errMsg);
        card.appendChild(retryBtn);
        errorWrap.appendChild(card);
        mount.appendChild(errorWrap);
      }
    }

    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
