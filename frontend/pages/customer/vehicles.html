<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Vehicles — Smart Parking</title>
  <meta name="description" content="Register and manage your vehicles for automated access and hassle-free parking reservations.">
  <meta name="theme-color" content="#A8532E">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../../images/smart-parking-icon.svg">
  <link rel="alternate icon" type="image/png" href="../../images/favicon.png">

  <!-- Google Fonts: Fraunces (Serif) & Inter (Sans-Serif) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/navbar.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>
  <!-- Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script src="../../js/ui.js"></script>
  <script src="../../js/shell.js"></script>

  <script>
    async function initVehicles() {
      try {
        const appContent = renderShell('vehicles');
        if (!appContent) return;

      // Page Header
      const header = document.createElement('header');
      header.className = 'app-page-header';

      const titleWrap = document.createElement('div');
      const eyebrow = document.createElement('p');
      eyebrow.className = 'app-page-eyebrow';
      eyebrow.textContent = 'Vehicle Management';

      const title = document.createElement('h1');
      title.className = 'app-page-title';
      title.textContent = 'My Vehicles';

      const desc = document.createElement('p');
      desc.className = 'app-page-desc';
      desc.textContent = 'Add, modify, or remove vehicles authorized for parking reservations.';

      titleWrap.appendChild(eyebrow);
      titleWrap.appendChild(title);
      titleWrap.appendChild(desc);
      header.appendChild(titleWrap);

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn-primary';
      addBtn.textContent = 'Add Vehicle';
      addBtn.addEventListener('click', () => openVehicleModal());
      header.appendChild(addBtn);

      appContent.appendChild(header);

      // Vehicle Grid Container
      const grid = document.createElement('div');
      grid.id = 'vehicle-grid';
      grid.className = 'vehicle-grid';
      grid.appendChild(loadingSkeleton(3, 'card'));
      appContent.appendChild(grid);

      // Fetch and display vehicles
      async function loadVehicles() {
        grid.innerHTML = '';
        grid.appendChild(loadingSkeleton(3, 'card'));

        try {
          const res = await apiRequest('/vehicles');
          const vehicles = (res.vehicles || []).filter((v) => v.status === 'ACTIVE');

          grid.innerHTML = '';

          if (vehicles.length === 0) {
            const empty = emptyState(
              'No Vehicles Registered',
              'You have not added any vehicles to your account yet. Register your vehicle to start reserving parking slots.',
              'Add Your First Vehicle',
              '#add-vehicle'
            );
            const actionLink = empty.querySelector('.empty-state-btn');
            if (actionLink) {
              actionLink.addEventListener('click', (e) => {
                e.preventDefault();
                openVehicleModal();
              });
            }
            grid.appendChild(empty);
          } else {
            vehicles.forEach((v) => {
              const card = createVehicleCard(v);
              grid.appendChild(card);
            });
          }
        } catch (err) {
          console.error('Failed to load vehicles:', err);
          grid.innerHTML = '';
          const errorCard = emptyState(
            'Unable to Load Vehicles',
            err.message || 'Server error loading vehicle list.',
            'Try Again',
            '#retry'
          );
          const retryBtn = errorCard.querySelector('.empty-state-btn');
          if (retryBtn) {
            retryBtn.addEventListener('click', (e) => {
              e.preventDefault();
              loadVehicles();
            });
          }
          grid.appendChild(errorCard);
        }
      }

      function createVehicleCard(v) {
        const card = document.createElement('article');
        card.className = 'vehicle-card';
        card.id = `vehicle-card-${v._id}`;

        const top = document.createElement('div');
        top.className = 'vehicle-card-top';

        const info = document.createElement('div');
        const titleEl = document.createElement('h3');
        titleEl.className = 'vehicle-brand-model';
        titleEl.textContent = `${v.brand} ${v.model}`;

        const regPill = document.createElement('div');
        regPill.className = 'vehicle-reg-pill';
        regPill.textContent = v.registrationNumber;

        info.appendChild(titleEl);
        info.appendChild(regPill);
        top.appendChild(info);

        const badge = statusBadge(v.status);
        top.appendChild(badge);
        card.appendChild(top);

        const metaList = document.createElement('div');
        metaList.className = 'vehicle-meta-list';

        const typeLine = document.createElement('div');
        typeLine.textContent = `Type: ${v.vehicleType}`;

        const colorLine = document.createElement('div');
        colorLine.textContent = `Color: ${v.color}`;

        metaList.appendChild(typeLine);
        metaList.appendChild(colorLine);

        if (v.nickname) {
          const nickLine = document.createElement('div');
          nickLine.textContent = `Nickname: "${v.nickname}"`;
          metaList.appendChild(nickLine);
        }

        card.appendChild(metaList);

        // Actions
        const actions = document.createElement('div');
        actions.className = 'vehicle-card-actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.className = 'btn-secondary';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => openVehicleModal(v));

        const deleteBtn = document.createElement('button');
        deleteBtn.type = 'button';
        deleteBtn.className = 'btn-danger';
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', async () => {
          const confirmed = await confirmDialog(
            'Remove Vehicle',
            `Are you sure you want to remove ${v.brand} ${v.model} (${v.registrationNumber}) from your account? This action cannot be undone.`
          );
          if (!confirmed) return;

          try {
            await apiRequest(`/vehicles/${v._id}`, { method: 'DELETE' });
            showToast('Vehicle removed successfully.', 'success');
            loadVehicles();
          } catch (err) {
            showToast(err.message || 'Failed to delete vehicle.', 'error');
          }
        });

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);
        card.appendChild(actions);

        return card;
      }

      // Add / Edit Modal Builder
      function openVehicleModal(existingVehicle = null) {
        const isEdit = Boolean(existingVehicle);
        const form = document.createElement('form');
        form.className = 'auth-form';
        form.noValidate = true;

        const errorAlert = document.createElement('div');
        errorAlert.className = 'auth-alert';
        errorAlert.setAttribute('role', 'alert');
        form.appendChild(errorAlert);

        // Vehicle Type Select
        const typeGroup = document.createElement('div');
        typeGroup.className = 'form-field';
        const typeLabel = document.createElement('label');
        typeLabel.className = 'form-label';
        typeLabel.textContent = 'Vehicle Type *';
        typeLabel.htmlFor = 'modal-v-type';

        const typeSelect = document.createElement('select');
        typeSelect.id = 'modal-v-type';
        typeSelect.className = 'form-input';
        ['CAR', 'MOTORCYCLE', 'SUV', 'MICROBUS', 'PICKUP', 'VAN'].forEach((t) => {
          const opt = document.createElement('option');
          opt.value = t;
          opt.textContent = t;
          if (existingVehicle && existingVehicle.vehicleType === t) {
            opt.selected = true;
          }
          typeSelect.appendChild(opt);
        });
        typeGroup.appendChild(typeLabel);
        typeGroup.appendChild(typeSelect);
        form.appendChild(typeGroup);

        // Brand Input
        const brandGroup = document.createElement('div');
        brandGroup.className = 'form-field';
        const brandLabel = document.createElement('label');
        brandLabel.className = 'form-label';
        brandLabel.textContent = 'Brand / Make *';
        brandLabel.htmlFor = 'modal-v-brand';
        const brandInput = document.createElement('input');
        brandInput.type = 'text';
        brandInput.id = 'modal-v-brand';
        brandInput.className = 'form-input';
        brandInput.placeholder = 'e.g. Toyota, Honda';
        brandInput.value = existingVehicle ? existingVehicle.brand : '';
        brandGroup.appendChild(brandLabel);
        brandGroup.appendChild(brandInput);
        form.appendChild(brandGroup);

        // Model Input
        const modelGroup = document.createElement('div');
        modelGroup.className = 'form-field';
        const modelLabel = document.createElement('label');
        modelLabel.className = 'form-label';
        modelLabel.textContent = 'Model *';
        modelLabel.htmlFor = 'modal-v-model';
        const modelInput = document.createElement('input');
        modelInput.type = 'text';
        modelInput.id = 'modal-v-model';
        modelInput.className = 'form-input';
        modelInput.placeholder = 'e.g. Corolla, Civic';
        modelInput.value = existingVehicle ? existingVehicle.model : '';
        modelGroup.appendChild(modelLabel);
        modelGroup.appendChild(modelInput);
        form.appendChild(modelGroup);

        // Color Input
        const colorGroup = document.createElement('div');
        colorGroup.className = 'form-field';
        const colorLabel = document.createElement('label');
        colorLabel.className = 'form-label';
        colorLabel.textContent = 'Color *';
        colorLabel.htmlFor = 'modal-v-color';
        const colorInput = document.createElement('input');
        colorInput.type = 'text';
        colorInput.id = 'modal-v-color';
        colorInput.className = 'form-input';
        colorInput.placeholder = 'e.g. Pearl White, Silver';
        colorInput.value = existingVehicle ? existingVehicle.color : '';
        colorGroup.appendChild(colorLabel);
        colorGroup.appendChild(colorInput);
        form.appendChild(colorGroup);

        // Registration Number Input
        const regGroup = document.createElement('div');
        regGroup.className = 'form-field';
        const regLabel = document.createElement('label');
        regLabel.className = 'form-label';
        regLabel.textContent = 'Registration / License Plate *';
        regLabel.htmlFor = 'modal-v-reg';
        const regInput = document.createElement('input');
        regInput.type = 'text';
        regInput.id = 'modal-v-reg';
        regInput.className = 'form-input';
        regInput.placeholder = 'e.g. DHA-GA-11-2233';
        regInput.value = existingVehicle ? existingVehicle.registrationNumber : '';
        regGroup.appendChild(regLabel);
        regGroup.appendChild(regInput);
        form.appendChild(regGroup);

        // Nickname Input (Optional)
        const nickGroup = document.createElement('div');
        nickGroup.className = 'form-field';
        const nickLabel = document.createElement('label');
        nickLabel.className = 'form-label';
        nickLabel.textContent = 'Nickname (Optional)';
        nickLabel.htmlFor = 'modal-v-nick';
        const nickInput = document.createElement('input');
        nickInput.type = 'text';
        nickInput.id = 'modal-v-nick';
        nickInput.className = 'form-input';
        nickInput.placeholder = 'e.g. Daily Commuter';
        nickInput.value = existingVehicle && existingVehicle.nickname ? existingVehicle.nickname : '';
        nickGroup.appendChild(nickLabel);
        nickGroup.appendChild(nickInput);
        form.appendChild(nickGroup);

        // Footer buttons
        const footer = document.createElement('div');
        footer.className = 'modal-footer';

        const cancelBtn = document.createElement('button');
        cancelBtn.type = 'button';
        cancelBtn.className = 'btn-secondary';
        cancelBtn.textContent = 'Cancel';

        const submitBtn = document.createElement('button');
        submitBtn.type = 'submit';
        submitBtn.className = 'btn-primary';
        submitBtn.textContent = isEdit ? 'Save Changes' : 'Register Vehicle';

        footer.appendChild(cancelBtn);
        footer.appendChild(submitBtn);
        form.appendChild(footer);

        let modalInstance = null;

        cancelBtn.addEventListener('click', () => {
          if (modalInstance) modalInstance.close();
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          errorAlert.textContent = '';
          errorAlert.classList.remove('is-visible');

          const vehicleType = typeSelect.value;
          const brand = brandInput.value.trim();
          const model = modelInput.value.trim();
          const color = colorInput.value.trim();
          const registrationNumber = regInput.value.trim().toUpperCase();
          const nickname = nickInput.value.trim();

          if (!brand) {
            errorAlert.textContent = 'Please enter vehicle brand.';
            errorAlert.classList.add('is-visible');
            brandInput.focus();
            return;
          }

          if (!model) {
            errorAlert.textContent = 'Please enter vehicle model.';
            errorAlert.classList.add('is-visible');
            modelInput.focus();
            return;
          }

          if (!color) {
            errorAlert.textContent = 'Please enter vehicle color.';
            errorAlert.classList.add('is-visible');
            colorInput.focus();
            return;
          }

          if (!registrationNumber) {
            errorAlert.textContent = 'Please enter vehicle registration number.';
            errorAlert.classList.add('is-visible');
            regInput.focus();
            return;
          }

          submitBtn.disabled = true;
          const originalText = submitBtn.textContent;
          submitBtn.textContent = 'Please wait...';

          try {
            const payload = {
              vehicleType,
              brand,
              model,
              color,
              registrationNumber,
              nickname
            };

            if (isEdit) {
              await apiRequest(`/vehicles/${existingVehicle._id}`, {
                method: 'PUT',
                body: JSON.stringify(payload)
              });
              showToast('Vehicle updated successfully.', 'success');
            } else {
              await apiRequest('/vehicles', {
                method: 'POST',
                body: JSON.stringify(payload)
              });
              showToast('Vehicle registered successfully.', 'success');
            }

            modalInstance.close();
            loadVehicles();
          } catch (err) {
            errorAlert.textContent = err.message || 'Operation failed. Please verify the vehicle details.';
            errorAlert.classList.add('is-visible');
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        });

        modalInstance = openModal(form, {
          title: isEdit ? 'Edit Vehicle' : 'Register Vehicle'
        });
      }

        await loadVehicles();
      } catch (err) {
        console.error('Vehicles initialization error:', err);
        const mount = document.getElementById('app-content') || document.body;
        mount.innerHTML = '';

        const errorWrap = document.createElement('div');
        errorWrap.className = 'container';
        errorWrap.style.padding = 'var(--space-8) var(--space-4)';

        const card = document.createElement('div');
        card.className = 'empty-state';
        card.style.maxWidth = '600px';
        card.style.margin = '0 auto';

        const errTitle = document.createElement('h2');
        errTitle.className = 'empty-state-title';
        errTitle.textContent = 'Unable to Load Vehicles';

        const errMsg = document.createElement('p');
        errMsg.className = 'empty-state-text';
        errMsg.textContent = err.message || 'An unexpected error occurred while initializing the vehicles view.';

        const retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'btn-primary';
        retryBtn.textContent = 'Retry';
        retryBtn.addEventListener('click', () => {
          window.location.reload();
        });

        card.appendChild(errTitle);
        card.appendChild(errMsg);
        card.appendChild(retryBtn);
        errorWrap.appendChild(card);
        mount.appendChild(errorWrap);
      }
    }

    document.addEventListener('DOMContentLoaded', initVehicles);
  </script>
</body>
</html>
